description:
  en: |
    A block-pushing puzzle in the Sokoban tradition and dB-Soft's best-known game.
    Every screen asks the same thing — get the blue stone onto the blue tile — and
    everything else is in the way: brick walls to squeeze past, boulders to shove
    out of the line, and monsters wandering the maze. A single shove in the wrong
    direction can leave a screen unsolvable.

    Two hundred "sides", with a five-letter password every fifth one; the list
    reads like a Japanese phrasebook — sAKE!, Ramen, Tokyo, Yuki!. Anyone who
    cleared them all was meant to move on to dB-Soft's harder sequel, King
    Flappy.
  cs: |
    Hlavolam s posunováním kamenů v sokobanovské tradici a nejznámější titul
    dB-Softu. Každá obrazovka chce totéž — dostat modrý kámen na modrou dlaždici —
    a všechno ostatní překáží: cihlové zdi, kterými je nutné se protáhnout,
    balvany, které je potřeba odstrkat z cesty, a nestvůry bloudící bludištěm.
    Jediné strčení špatným směrem umí obrazovku udělat neřešitelnou.

    Dvě stě „sides" a pětipísmenné heslo ke každé páté; jejich seznam vypadá jako
    japonská konverzační příručka — sAKE!, Ramen, Tokyo, Yuki!. Kdo je vyřešil
    všechny, měl přejít k těžšímu pokračování King Flappy.
  de: |
    Ein Schiebe-Puzzle in der Sokoban-Tradition und dB-Softs bekanntestes Spiel.
    Jeder Bildschirm verlangt dasselbe — den blauen Stein auf die blaue Kachel
    bringen — und alles andere steht im Weg: Ziegelmauern, an denen man sich
    vorbeizwängt, Felsbrocken, die aus der Bahn geschoben werden wollen, und
    Monster, die durch das Labyrinth streifen. Ein einziger Schub in die falsche
    Richtung kann einen Bildschirm unlösbar machen.

    Zweihundert „Sides", mit einem fünfstelligen Passwort für jede fünfte; die
    Liste liest sich wie ein japanischer Sprachführer — sAKE!, Ramen, Tokyo,
    Yuki!. Wer alle geschafft hatte, sollte zum schwereren King Flappy
    weiterziehen.
  ja: |
    倉庫番の系譜にある押し込み型パズルで、dB-SOFTの代表作。どの面も課題は同じ、青い石を青いタイルへ運ぶこと。邪魔をするのはすり抜けるべきレンガの壁、道から押しのける岩、迷路をうろつく敵。一度でも押す向きを間違えると、その面は詰んでしまう。

    全200面で、5面ごとに5文字のパスワードが用意されている。その一覧は日本語の単語帳のようで、sAKE!、Ramen、Tokyo、Yuki! と並ぶ。全面クリアした人のために、より難しい続編『キングフラッピー』が用意された。
