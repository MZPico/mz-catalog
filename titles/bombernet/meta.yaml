title: "BomberNet"
web: false
network: true
spotlight:
  en: "The first Sharp MZ game with network play. Host a room on your MZ-800 with an MZPico, or right here in the browser, and hand the four-letter code to a friend. Coop or deathmatch, up to four players, any mix of local and remote. Now also on the ZX Spectrum, in the same rooms."
  cs: "První hra pro Sharp MZ s hraním po síti. Založte místnost na svém MZ-800 s MZPico nebo přímo tady v prohlížeči a pošlete kamarádovi čtyřpísmenný kód. Kooperace nebo deathmatch, až čtyři hráči, libovolná kombinace místních a vzdálených. Nově i na ZX Spectru, ve stejných místnostech."
  de: "Das erste Sharp-MZ-Spiel mit Netzwerkmodus. Eröffne einen Raum auf deinem MZ-800 mit MZPico oder direkt hier im Browser und gib den Vier-Buchstaben-Code weiter. Koop oder Deathmatch, bis zu vier Spieler, lokal und übers Netz gemischt. Jetzt auch auf dem ZX Spectrum, in denselben Räumen."
  ja: "Sharp MZ 初のネットワーク対戦ゲーム。MZPico 付きの MZ-800 か、このブラウザーでルームを作り、4 文字のコードを友達に伝えるだけ。協力プレイでもデスマッチでも、最大 4 人、ローカルとリモートの組み合わせは自由です。ZX Spectrum 版も同じルームで遊べます。"   # archive + browser play only for now; true = front page, machine pages and the card's Featured folder
year: 2026
publisher: "MZPico"
original:
  title: "Bomber Man"
  publisher: "Hudson Soft Inc."
  year: 1983
machine: mz-700
genre: [game]
files:
  - path: bombernet.mzf
    kind: standard
    note: "Build with network play; needs an MZPico (or this browser player) for online rooms."
extras:
  - path: bombernet.tap
    machine: zx-spectrum
    screenshots: [zx-01-title.png, zx-02-game.png]
    note:
      en: >-
        BomberNet 0.2.0 on a ZX Spectrum 48K or larger. Network play needs a Spectranet or a
        Spectranext: a Spectrum joins the same rooms as MZ-800s and this browser player. Start
        the tape with LOAD "" (on a Spectranext, choose 48 BASIC first). Keys: Q A O P and Space,
        the Sinclair joystick keys, or a Kempston, Fuller or Cursor joystick. Also runs in the
        FuseX emulator.
      cs: >-
        BomberNet 0.2.0 pro ZX Spectrum 48K a větší. Síťová hra potřebuje Spectranet nebo
        Spectranext: Spectrum se připojí do stejných místností jako MZ-800 a tento přehrávač v
        prohlížeči. Pásku spustíte příkazem LOAD "" (na Spectranextu nejdřív zvolte 48 BASIC).
        Ovládání: Q A O P a mezerník, klávesy joysticků Sinclair nebo joystick Kempston, Fuller
        či Cursor. Běží i v emulátoru FuseX.
      de: >-
        BomberNet 0.2.0 für den ZX Spectrum 48K oder größer. Für das Netzwerkspiel braucht es ein
        Spectranet oder einen Spectranext: Ein Spectrum tritt denselben Räumen bei wie MZ-800 und
        dieser Browser-Player. Das Band mit LOAD "" starten (beim Spectranext zuerst 48 BASIC
        wählen). Steuerung: Q A O P und Leertaste, die Sinclair-Joystick-Tasten oder ein Kempston-,
        Fuller- oder Cursor-Joystick. Läuft auch im Emulator FuseX.
      ja: >-
        ZX Spectrum 48K 以上で動く BomberNet 0.2.0 です。ネットワーク対戦には Spectranet か
        Spectranext が必要で、MZ-800 やこのブラウザープレイヤーと同じルームに参加できます。テープは
        LOAD "" で起動します(Spectranext では先に 48 BASIC を選択)。操作は Q A O P とスペース、
        Sinclair ジョイスティックのキー、または Kempston・Fuller・Cursor ジョイスティック。FuseX
        エミュレーターでも動きます。
description:
  en: |
    The 1983 Bomber Man rebuilt for more players. Cooperative or deathmatch for up
    to four: two on the keyboard, two on joysticks, and over the network between
    MZ-800s with an MZPico and this browser player. Same bricks, monsters, bonus
    and exit as the original; player colours, a lobby with four-letter room codes
    and lockstep play are new.

    Pick MODE, PLAYERS and inputs on the title with the cursor keys. HOST creates a
    room and shows its code; JOIN asks for one. Since 0.2.0 BomberNet also runs on
    the ZX Spectrum (below), and a Spectrum and an MZ-800 play in the same room.
    Source and protocol: github.com/MZPico/BomberNet.
  cs: |
    Bomber Man z roku 1983 přestavěný pro více hráčů. Kooperace nebo deathmatch až
    pro čtyři: dva na klávesnici, dva na joysticích a po síti mezi MZ-800 s MZPico
    a tímto přehrávačem v prohlížeči. Stejné cihly, příšery, bonus i východ jako v
    originále; nové jsou barvy hráčů, lobby s čtyřpísmennými kódy místností a
    synchronní hra.

    Na titulní obrazovce se kurzorovými klávesami volí MODE, PLAYERS a ovládání.
    HOST založí místnost a ukáže její kód, JOIN si o kód řekne. Od verze 0.2.0 běží
    BomberNet i na ZX Spectru (níže) a Spectrum s MZ-800 hrají v jedné místnosti.
    Zdrojové kódy a protokol: github.com/MZPico/BomberNet.
controls: |
  Cursor keys — menu, player 1
  Space — start, drop a bomb (CR when a second keyboard player is set)
  W A S D + E — player 2 on the keyboard
touch:
  buttons:
    - { label: "BOMB", key: "Space" }
    - { label: "E", key: "E" }
source: MZPico/BomberNet on GitHub, built from the C port of the 1983 Hudson Soft original (bomber.mzf in this catalog).
