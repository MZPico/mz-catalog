    needs:
      en: "Any PC from an 8088 up, DOS 3 or FreeDOS; CGA, EGA or VGA; PC speaker, AdLib or Sound Blaster. BOMBER /? lists the switches."
      cs: "Jakékoli PC od 8088 výš, DOS 3 nebo FreeDOS; CGA, EGA nebo VGA; PC speaker, AdLib nebo Sound Blaster. BOMBER /? vypíše přepínače."
      de: "Jeder PC ab 8088, DOS 3 oder FreeDOS; CGA, EGA oder VGA; PC-Lautsprecher, AdLib oder Sound Blaster. BOMBER /? listet die Schalter."
      ja: "8088 以降の PC、DOS 3 または FreeDOS。CGA、EGA、VGA 対応。PC スピーカー、AdLib、Sound Blaster。BOMBER /? でスイッチ一覧。"
    network:
      en: "Ethernet with a DOS packet driver, or a Wi-Fi modem on COM1 or COM2."
      cs: "Ethernet s DOSovým packet driverem, nebo Wi-Fi modem na COM1 či COM2."
      de: "Ethernet mit einem DOS-Packet-Driver oder ein WLAN-Modem an COM1 oder COM2."
      ja: "DOS パケットドライバー経由のイーサネット、または COM1/COM2 の Wi-Fi モデム。"
    keys:
      en: "Cursor keys and Space (or Return); W A S D and E; two game-port joysticks; ESC leaves a match, Alt+X quits."
      cs: "Kurzorové klávesy a mezerník (nebo Return); W A S D a E; dva joysticky v game portu; ESC opustí zápas, Alt+X ukončí program."
      de: "Cursortasten und Leertaste (oder Return); W A S D und E; zwei Joysticks am Gameport; ESC verlässt ein Match, Alt+X beendet."
      ja: "カーソルキーとスペース (または Return)、W A S D と E、ゲームポートのジョイスティック 2 本。ESC で対戦から抜け、Alt+X で終了。"
    limits:
      en: "An XT at 4.77 MHz plays in plain lockstep, a little slower in a network match; from a 286 up the run-ahead hides the input delay."
      cs: "XT na 4,77 MHz hraje v prostém lockstepu, v síťovém zápase o něco pomaleji; od 286 výš předbíhání skryje zpoždění vstupu."
      de: "Ein XT mit 4,77 MHz spielt im einfachen Lockstep, im Netzwerk-Match etwas langsamer; ab einem 286 verbirgt das Run-ahead die Eingabeverzögerung."
      ja: "4.77 MHz の XT は通常のロックステップで動き、ネットワーク対戦では少し遅くなります。286 以上では先行実行が入力遅延を隠します。"
source: MZPico/BomberNet on GitHub, built from the C port of the 1983 Hudson Soft original (bomber.mzf, the MZ-700 tape).
