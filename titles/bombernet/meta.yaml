title: "BomberNet"
web: true
network: true
version: "0.3.0"
release: https://github.com/MZPico/BomberNet/releases/tag/v0.3.0
play: /bombernet/                       # the game compiled to WebAssembly (BomberNet c/platform/web), not the emulated MZ-800
spotlight:
  en: "Bomberman for the classic home computers, with network play. Ten machines, from the Sharp MZ-800 and the ZX Spectrum to the Amiga, the PC and your browser, meet in one room: co-op or deathmatch, up to four players, local and remote in any mix. Based on the 1983 Bomber Man for the MZ-700."
  cs: "Bomberman pro klasické domácí počítače, s hrou po síti. Deset strojů, od Sharpu MZ-800 a ZX Spectra po Amigu, PC a váš prohlížeč, se sejde v jedné místnosti: kooperace nebo deathmatch, až čtyři hráči, místní i vzdálení v libovolné kombinaci. Podle Bomber Mana pro MZ-700 z roku 1983."
  de: "Bomberman für die klassischen Heimcomputer, mit Netzwerkspiel. Zehn Rechner, vom Sharp MZ-800 und ZX Spectrum bis zum Amiga, PC und deinem Browser, treffen sich in einem Raum: Koop oder Deathmatch, bis zu vier Spieler, lokal und übers Netz gemischt. Nach dem Bomber Man für den MZ-700 von 1983."
  ja: "クラシックなホームコンピューター向けのボンバーマン、ネットワーク対戦つき。Sharp MZ-800 や ZX Spectrum から Amiga、PC、そしてブラウザーまで、10 機種が同じルームに集まります。協力プレイでもデスマッチでも、最大 4 人、ローカルとリモートの組み合わせは自由。1983 年の MZ-700 版ボンバーマンがもとになっています。"
year: 2026
publisher: "MZPico"
original:
  title: "Bomber Man"
  publisher: "Hudson Soft Inc."
  year: 1983
machine: mz-700
genre: [game]
files:
  - path: bombernet.mzf
    kind: standard
    note: "The Sharp MZ-800 build (the MZ-700 plays locally); online rooms need an MZPico with a Pico W and Wi-Fi enabled, or a Unicard with the NET firmware and a relay of your own."
description:
  en: |
    Hudson Soft's 1983 Bomber Man for the Sharp MZ-700, taken apart and rebuilt as one
    game for ten machines: the Sharp MZ-800, the ZX Spectrum, the Amstrad CPC, the Atari
    XL/XE, the Commodore 64, the Amiga, the Atari ST, the IBM PC under DOS, and the browser,
    where it runs compiled to WebAssembly. Same bricks, monsters, bonus and exit as the
    original; the four player colours, the lobby with its room codes and the lockstep play
    are new, and every machine simulates the same frames, so any of them meet in one room.

    Co-op: one to four players clear the stages together. Deathmatch: no monsters, the
    players start in the corners, the last one standing wins the round and the first to win
    three rounds wins the match. Up to four people play on one machine, sharing the keyboard
    and the joysticks, or on several machines over the network, in any mix. To play online,
    one player chooses HOST and gets a four-letter room code; the others choose JOIN and
    type it in. Source, documents and the releases: github.com/MZPico/BomberNet.
  cs: |
    Bomber Man od Hudson Softu z roku 1983 pro Sharp MZ-700, rozebraný a znovu postavený
    jako jedna hra pro deset strojů: Sharp MZ-800, ZX Spectrum, Amstrad CPC, Atari XL/XE,
    Commodore 64, Amiga, Atari ST, IBM PC pod DOSem a prohlížeč, kde běží přeložená do
    WebAssembly. Stejné cihly, příšery, bonus i východ jako v originále; nové jsou čtyři
    barvy hráčů, lobby s kódy místností a synchronní hra, a každý stroj počítá tytéž snímky,
    takže se kterékoli z nich sejdou v jedné místnosti.

    Kooperace: jeden až čtyři hráči společně čistí úrovně. Deathmatch: bez příšer, hráči
    začínají v rozích, poslední přeživší vyhrává kolo a kdo první vyhraje tři kola, vyhrává
    zápas. Na jednom stroji hrají až čtyři lidé, o klávesnici a joysticky se podělí, nebo na
    více strojích po síti, v libovolné kombinaci. Pro hru online jeden hráč zvolí HOST a
    dostane čtyřpísmenný kód místnosti; ostatní zvolí JOIN a kód zadají. Zdrojové kódy,
    dokumenty a vydání: github.com/MZPico/BomberNet.
  de: |
    Hudson Softs Bomber Man von 1983 für den Sharp MZ-700, auseinandergenommen und als ein
    Spiel für zehn Rechner neu gebaut: Sharp MZ-800, ZX Spectrum, Amstrad CPC, Atari XL/XE,
    Commodore 64, Amiga, Atari ST, IBM PC unter DOS und der Browser, wo es nach WebAssembly
    übersetzt läuft. Dieselben Ziegel, Monster, Bonus und Ausgang wie im Original; neu sind
    die vier Spielerfarben, die Lobby mit ihren Raumcodes und das Lockstep-Spiel, und jeder
    Rechner berechnet dieselben Frames, sodass sich beliebige in einem Raum treffen.

    Koop: ein bis vier Spieler räumen die Level gemeinsam. Deathmatch: keine Monster, die
    Spieler starten in den Ecken, der letzte Überlebende gewinnt die Runde und wer zuerst
    drei Runden gewinnt, gewinnt das Match. Bis zu vier Leute spielen an einem Rechner und
    teilen sich Tastatur und Joysticks, oder an mehreren Rechnern übers Netz, beliebig
    gemischt. Für ein Spiel online wählt ein Spieler HOST und bekommt einen Raumcode aus vier
    Buchstaben; die anderen wählen JOIN und tippen ihn ein. Quelltext, Dokumente und die
    Veröffentlichungen: github.com/MZPico/BomberNet.
  ja: |
    1983 年にハドソンが Sharp MZ-700 向けに出したボンバーマンを解析し、10 機種で動く 1 本の
    ゲームとして作り直しました。Sharp MZ-800、ZX Spectrum、Amstrad CPC、Atari XL/XE、
    Commodore 64、Amiga、Atari ST、DOS の IBM PC、そして WebAssembly に変換して動くブラウザー
    版です。ブロック、モンスター、ボーナス、出口はオリジナルのまま。4 色のプレイヤー、ルーム
    コードつきのロビー、ロックステップ対戦が新しく、どの機種も同じフレームを計算するので、
    どの組み合わせでも同じルームで遊べます。

    協力プレイでは 1〜4 人でステージを進みます。デスマッチにはモンスターがおらず、四隅から
    始めて最後まで残った人がラウンドの勝者、先に 3 ラウンド取った人が勝ちです。1 台でキーボ
    ードとジョイスティックを分け合って最大 4 人、または複数の機種でネットワーク越しに、組み
    合わせは自由。オンラインで遊ぶには、1 人が HOST を選んで 4 文字のルームコードを受け取り、
    ほかの人は JOIN を選んでそのコードを入力します。ソースコード、資料、リリース:
    github.com/MZPico/BomberNet。
controls: |
  Cursor keys — menu, player 1
  Space — start, drop a bomb (CR when a second keyboard player is set)
  W A S D + E — player 2 on the keyboard
  BREAK (ESC) — leave a match or cancel a room code
ports:
  - machine: browser
    name: "Browser"
    play: true
    needs:
      en: "Any phone, tablet or computer; nothing to install. Touch controls on a phone."
      cs: "Jakýkoli telefon, tablet nebo počítač; nic se neinstaluje. Na telefonu dotykové ovládání."
      de: "Jedes Telefon, Tablet oder jeder Computer; nichts zu installieren. Am Telefon Touch-Steuerung."
      ja: "スマートフォン、タブレット、パソコンのどれでも。インストール不要。スマートフォンではタッチ操作。"
    network:
      en: "Built in: the same rooms as every other machine."
      cs: "Vestavěná: stejné místnosti jako všechny ostatní stroje."
      de: "Eingebaut: dieselben Räume wie alle anderen Rechner."
      ja: "内蔵。ほかの機種と同じルームに参加できます。"
    keys:
      en: "Cursor keys and Space; W A S D and E for a second player; gamepads; ESC leaves a match."
      cs: "Kurzorové klávesy a mezerník; W A S D a E pro druhého hráče; gamepady; ESC opustí zápas."
      de: "Cursortasten und Leertaste; W A S D und E für einen zweiten Spieler; Gamepads; ESC verlässt ein Match."
      ja: "カーソルキーとスペース、2 人目は W A S D と E、ゲームパッドも可。ESC で対戦から抜けます。"
    limits:
      en: "Shows your own player without the network's input delay (run-ahead)."
      cs: "Vlastního hráče ukazuje bez síťového zpoždění vstupu (předbíhání)."
      de: "Zeigt den eigenen Spieler ohne die Eingabeverzögerung des Netzes (Run-ahead)."
      ja: "自分のプレイヤーはネットワークの入力遅延なしに表示されます (先行実行)。"
  - machine: mz-800
    guide: https://github.com/MZPico/BomberNet/blob/main/docs/setup/mz-800.md
    name: "Sharp MZ-800"
    files:
      - { path: bombernet.mzf, label: ".mzf" }
    needs:
      en: "A Sharp MZ-800; an MZPico loads it straight from this catalog. The MZ-700 plays locally."
      cs: "Sharp MZ-800; MZPico ho nahraje přímo z tohoto katalogu. Na MZ-700 se hraje bez sítě."
      de: "Ein Sharp MZ-800; ein MZPico lädt es direkt aus diesem Katalog. Der MZ-700 spielt ohne Netz."
      ja: "Sharp MZ-800。MZPico ならこのカタログから直接読み込めます。MZ-700 ではローカルプレイのみ。"
    network:
      en: "An MZPico built on a Raspberry Pi Pico W, with Wi-Fi enabled in its configuration; or a Unicard with the NET firmware, on a home network with a relay of your own."
      cs: "MZPico postavené na Raspberry Pi Pico W se zapnutou Wi-Fi v jeho konfiguraci; nebo Unicard s firmwarem NET v domácí síti s vlastním relay serverem."
      de: "Ein MZPico auf Basis eines Raspberry Pi Pico W mit in seiner Konfiguration aktiviertem WLAN; oder eine Unicard mit der NET-Firmware im Heimnetz mit eigenem Relay."
      ja: "Raspberry Pi Pico W 搭載の MZPico で、その設定で Wi-Fi を有効にしたもの。または NET ファームウェアの Unicard と、家庭内ネットワーク上の自前のリレー。"
    keys:
      en: "Cursor keys and Space (or CR); W A S D and E; MZ-800 joysticks, MZ-1X03; BREAK leaves a match."
      cs: "Kurzorové klávesy a mezerník (nebo CR); W A S D a E; joysticky MZ-800, MZ-1X03; BREAK opustí zápas."
      de: "Cursortasten und Leertaste (oder CR); W A S D und E; MZ-800-Joysticks, MZ-1X03; BREAK verlässt ein Match."
      ja: "カーソルキーとスペース (または CR)、W A S D と E、MZ-800 ジョイスティック、MZ-1X03。BREAK で対戦から抜けます。"
  - machine: zx-spectrum-48k
    guide: https://github.com/MZPico/BomberNet/blob/main/docs/setup/zx-spectrum-48k.md
    name: "ZX Spectrum 48K"
    files:
      - { path: bombernet.tap, label: ".tap" }
    needs:
      en: "A ZX Spectrum 48K or larger; LOAD \"\" (on a Spectranext choose 48 BASIC first). Also runs in FuseX."
      cs: "ZX Spectrum 48K nebo větší; LOAD \"\" (na Spectranextu nejdřív zvolte 48 BASIC). Běží i ve FuseX."
      de: "Ein ZX Spectrum 48K oder größer; LOAD \"\" (beim Spectranext zuerst 48 BASIC wählen). Läuft auch in FuseX."
      ja: "ZX Spectrum 48K 以上。LOAD \"\" で起動 (Spectranext では先に 48 BASIC を選択)。FuseX でも動きます。"
    network:
      en: "A Spectranet or a Spectranext."
      cs: "Spectranet nebo Spectranext."
      de: "Ein Spectranet oder ein Spectranext."
      ja: "Spectranet または Spectranext。"
    keys:
      en: "Q A O P and Space (M when two share the keyboard); the Sinclair keys 6 to 0 and 1 to 5; Kempston, Fuller or Cursor joystick; BREAK leaves a match."
      cs: "Q A O P a mezerník (M, když se o klávesnici dělí dva); klávesy Sinclair 6 až 0 a 1 až 5; joystick Kempston, Fuller nebo Cursor; BREAK opustí zápas."
