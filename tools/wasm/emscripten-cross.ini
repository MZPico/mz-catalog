[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
pkg-config = 'pkg-config'

[built-in options]
c_args = ['-pthread', '-O2', '-Wno-incompatible-function-pointer-types', '-Wno-incompatible-pointer-types', '-Wno-int-conversion']
c_link_args = ['-pthread', '-L$HOME/src/wasm-sysroot/lib', '-lmzwasmstubs', '-sALLOW_TABLE_GROWTH=1', '-sEXPORTED_RUNTIME_METHODS=addFunction,removeFunction']
cpp_args = ['-pthread', '-O2', '-Wno-incompatible-function-pointer-types']
cpp_link_args = ['-pthread', '-L$HOME/src/wasm-sysroot/lib', '-lmzwasmstubs', '-sALLOW_TABLE_GROWTH=1', '-sEXPORTED_RUNTIME_METHODS=addFunction,removeFunction']
default_library = 'static'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[properties]
needs_exe_wrapper = true
